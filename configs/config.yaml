input_dir: input
output_dir: output

language: eng

ocr:
  enabled: auto
  force: false
  tool: ocrmypdf
  options:
    deskew: true
    clean: true

converter:
  engine: marker
  fallback_engines:
    - mineru
    - docling

figures:
  extract: true
  output_dir: figures
  naming_rule: figure_{index:03d}.png

markdown:
  normalize_headings: true
  normalize_equations: true
  normalize_captions: true
  normalize_references: true

batch:
  workers: 1
  skip_existing: false
  overwrite: false
  continue_on_error: true

# Research pipeline defaults. Supply API secrets only through
# OPENROUTER_API_KEY and NOTION_API_KEY environment variables.
research_interest: ""

zotero:
  base_url: http://localhost:23119/api/
  user_id: 0

openrouter:
  extraction_model: google/gemini-3.8-flash
  synthesis_model: openai/gpt-5.6-sol
  require_parameters: true
  zdr: true
  data_collection: false
  paper_budget_usd: 0.50

notion:
  data_source_id:
  api_version: "2026-03-11"
  # These names must already exist with the documented Notion types. The
  # Processing Status status/select must contain Completed; every Topics
  # multi-select value the pipeline will send must also exist in advance.
  properties:
    title: Title
    authors: Authors
    published_date: Published Date
    doi: DOI
    arxiv_id: arXiv ID
    source_url: Source URL
    zotero_link: Zotero Link
    zotero_item_key: Zotero Item Key
    processing_status: Processing Status
    relevance_score: Relevance Score
    score_rationale: Score Rationale
    topics: Topics
    ai_keywords: AI Keywords
    imported_at: Imported At
    model_prompt_version: Model / Prompt Version

quality:
  enabled: true
  check_equations: true
  check_figures: true
  check_captions: true
  check_reading_order: true
